name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Start Redis through Docker Compose
        run: docker compose up -d --wait redis
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test (mocked providers and real Redis)
        env:
          RUN_REDIS_TESTS: '1'
          REDIS_TEST_URL: redis://localhost:6379/15
        run: python -m pytest -q
      - name: Benchmark (synthetic provider, real Redis)
        env:
          BENCHMARK_REDIS_URL: redis://localhost:6379/15
        run: python scripts/benchmark.py --samples 10 --delay-ms 20
      - name: Build and smoke-test the complete Docker Compose stack
        run: |
          set -euo pipefail
          docker compose up -d --build --wait api
          # Container startup and port readiness can precede a valid HTTP response.
          # Retry connection resets as well as refused connections, with a time limit.
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            --connect-timeout 3 --max-time 8 \
            http://127.0.0.1:8000/docs -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/openapi.json \
            | python -c 'import json, sys; assert "/weather" in json.load(sys.stdin)["paths"]'
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/metrics \
            | python -c 'import json, sys; assert "cache_hits" in json.load(sys.stdin)'
          status=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 \
            --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:8000/weather?city=%20%20')
          test "$status" = "422"
      - name: Docker Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100 api redis
      - name: Stop Docker Compose
        if: always()
        run: docker compose down --remove-orphans
