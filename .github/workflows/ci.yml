name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test (mocked providers and real Redis)
        env:
          RUN_REDIS_TESTS: '1'
          REDIS_TEST_URL: redis://localhost:6379/15
        run: python -m pytest -q
      - name: Benchmark (synthetic provider, real Redis)
        env:
          BENCHMARK_REDIS_URL: redis://localhost:6379/15
        run: python scripts/benchmark.py --samples 10 --delay-ms 20
